services:
  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  django-app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./static:/app/staticfiles

  celery-worker:
    build: .
    command: celery -A ala_el_8ahwa worker --loglevel=info --concurrency=2
    depends_on:
      django-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A ala_el_8ahwa inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery-beat:
    build: .
    command: celery -A ala_el_8ahwa beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      django-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  nginx:
    build:
      context: .
      dockerfile: nginx.dockerfile
    volumes:
      - ./static:/static:ro
    depends_on:
      django-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
