name: ala_el_8ahwa

services:
  db-local:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.local
    container_name: ala_el_8ahwa_db_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  django-app-local:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db-local:
        condition: service_healthy
    volumes:
      - .:/app
      - ./static:/app/staticfiles
    env_file:
      - .env.local
    environment:
      - DJANGO_ENV=local
    container_name: ala_el_8ahwa_app_local

  nginx-local:
    build:
      context: .
      dockerfile: nginx.dockerfile
    environment:
      - DJANGO_UPSTREAM=django-app-local
    ports:
      - "8001:80"
    volumes:
      - ./static:/static:ro
    depends_on:
      django-app-local:
        condition: service_healthy
    container_name: ala_el_8ahwa_reverse_proxy_local
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
